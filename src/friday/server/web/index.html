<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0b0d12">
<title>Friday</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icone-192.png">
<style>
:root{--bg:#0b0d12;--panel:#141821;--line:#232a36;--text:#e6ebf2;--dim:#8b95a7;--accent:#f0a83c;
  --you:#2a2216;--danger:#e5675b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  border-bottom:1px solid var(--line)}
.brand{flex:1;min-width:0}
.brand b{display:block;letter-spacing:.32em;color:var(--accent);font-weight:600;font-size:15px}
#etat{color:var(--dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#etat::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;
  background:var(--dim);vertical-align:1px}
#etat.ok::before{background:#5fc28a}#etat.busy::before{background:var(--accent)}
#etat.off::before{background:var(--danger)}
header button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:50%;display:grid;
  place-items:center;color:var(--dim);border:1px solid var(--line)}
header button[aria-pressed="false"]{opacity:.45}
header svg{width:19px;height:19px}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.vide{margin:auto;text-align:center;color:var(--dim);max-width:280px;font-size:14.5px}
.vide b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}
.msg{max-width:86%;padding:9px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.vous{align-self:flex-end;background:var(--you);border:1px solid #4a3a1f;border-bottom-right-radius:5px}
.friday{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
.outil{align-self:flex-start;font-size:12.5px;color:var(--dim);border:1px solid var(--line);
  border-radius:12px;padding:3px 10px}
.attente{color:var(--dim);font-style:italic}
.erreur{color:var(--danger)}
footer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);background:var(--bg)}
#texte{flex:1;min-width:0;resize:none;max-height:120px;padding:11px 14px;border-radius:22px;
  border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;outline:none}
#texte:focus{border-color:#4a3a1f}
footer button{all:unset;cursor:pointer;flex:none;width:46px;height:46px;border-radius:50%;
  display:grid;place-items:center}
footer svg{width:22px;height:22px}
#envoyer{background:var(--panel);color:var(--accent);border:1px solid var(--line)}
#micro{width:56px;height:56px;background:var(--accent);color:#1a1307;touch-action:none;user-select:none;
  -webkit-user-select:none;transition:transform .12s,box-shadow .12s}
#micro.ecoute{transform:scale(1.12);box-shadow:0 0 0 8px rgba(240,168,60,.22),0 0 28px rgba(240,168,60,.5)}
button:disabled{opacity:.4;cursor:default}
#aide{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--panel);border:1px solid var(--line);color:var(--text);padding:7px 14px;
  border-radius:14px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#aide.voir{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand"><b>F.R.I.D.A.Y.</b><span id="etat">connexion…</span></div>
  <button id="son" aria-pressed="true" aria-label="Lire les réponses à voix haute">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  </button>
  <button id="nouvelle" aria-label="Nouvelle conversation">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>
  </button>
</header>
<main id="fil">
  <div class="vide"><b>Bonjour.</b>Maintenez le bouton orange pour parler, ou écrivez en bas.
  Le Pi met environ 15 à 50 secondes à répondre.</div>
</main>
<footer>
  <button id="micro" aria-label="Maintenir pour parler">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <textarea id="texte" rows="1" placeholder="Écrire à Friday…" enterkeyhint="send"></textarea>
  <button id="envoyer" aria-label="Envoyer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
  </button>
</footer>
<div id="aide"></div>
<script src="/app.js"></script>
</body>
</html>
