[project]
name = "friday"
version = "0.1.0"
description = "Assistant personnel vocal local (Ollama + Claude Code)"
authors = [
    { name = "FayTuaN-Dev", email = "crasnier.val@proton.me" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs>=9.16.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "numpy>=2.5.3",
    "ollama>=0.6.3",
    "pillow>=12.3.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sgp4>=2.27",
    "trafilatura>=2.3.0",
]

[project.scripts]
friday = "friday:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["bureau", "dev"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Consignes en prose pour le modèle : la première ligne de chaque bloc dépasse un peu
"src/friday/brain/skills.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
# Le bureau (fenêtre, micro, voix, carte graphique, Windows) : installé par défaut sur le PC.
# Le Friday léger du Raspberry Pi (« friday --serveur ») s'en passe :
#   uv sync --no-default-groups
bureau = [
    "faster-whisper>=1.2.1",
    "keyboard>=0.13.5",
    "mss>=10.2.0",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pyside6>=6.11.2",
    "sounddevice>=0.5.6",
    "winrt-windows-foundation>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-media-control>=3.2.1 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=3.2.1 ; sys_platform == 'win32'",
]
# L'oreille du Friday du Raspberry Pi (la voix arrive du téléphone) :
#   uv sync --no-default-groups --group oreille
oreille = [
    "faster-whisper>=1.2.1",
]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
