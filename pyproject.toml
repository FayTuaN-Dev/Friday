[project]
name = "friday"
version = "0.1.0"
description = "Assistant personnel vocal local (Ollama + Claude Code)"
authors = [
    { name = "FayTuaN-Dev", email = "crasnier.val@proton.me" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddgs>=9.16.0",
    "faster-whisper>=1.2.1",
    "keyboard>=0.13.5",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'win32'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'win32'",
    "ollama>=0.6.3",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pycaw>=20260927",
    "pypdf>=6.19.0",
    "pyside6>=6.11.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "trafilatura>=2.3.0",
]

[project.scripts]
friday = "friday:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
